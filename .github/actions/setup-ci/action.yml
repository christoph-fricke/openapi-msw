name: setup-ci
description: Prepares Node.js and dependencies

inputs:
  skip-cache:
    description: Disables the package manager cache
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: "package.json"
        package-manager-cache: ${{ inputs.skip-cache != 'true' }}
    - name: Install Dependencies
      shell: bash
      run: npm ci
